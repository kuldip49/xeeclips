services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: ai-content-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      SERVER_API_URL: http://backend:4000
      ENABLE_VISUAL_ANALYSIS: ${ENABLE_VISUAL_ANALYSIS:-false}
      SHOW_DEVELOPER_DIAGNOSTICS: ${SHOW_DEVELOPER_DIAGNOSTICS:-false}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ./apps/frontend
          target: /app/apps/frontend
        - action: rebuild
          path: ./apps/frontend/package.json

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        ENABLE_YOUTUBE_IMPORT: ${YOUTUBE_IMPORT_APPROVED:-false}
    container_name: ai-content-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the ignored .env file}
      REDIS_URL: redis://redis:6379
      VIDEO_WORKER_CONCURRENCY: ${VIDEO_WORKER_CONCURRENCY:-1}
      CLIP_RENDER_CONCURRENCY: ${CLIP_RENDER_CONCURRENCY:-1}
      CLIP_RENDER_STALE_MS: ${CLIP_RENDER_STALE_MS:-120000}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-1800000}
      ENDING_TAIL_VERIFICATION_ENABLED: ${ENDING_TAIL_VERIFICATION_ENABLED:-true}
      ENDING_STRONG_TAIL_ENABLED: ${ENDING_STRONG_TAIL_ENABLED:-true}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_MODEL_VERSION: ${WHISPER_MODEL_VERSION:-1}
      WHISPER_TAIL_MODEL_NAME: ${WHISPER_TAIL_MODEL_NAME:-whisper-medium}
      WHISPER_TAIL_MODEL_VERSION: ${WHISPER_TAIL_MODEL_VERSION:-1}
      ENABLE_VISUAL_ANALYSIS: ${ENABLE_VISUAL_ANALYSIS:-false}
      FORCE_REPROCESS: ${FORCE_REPROCESS:-false}
      YOUTUBE_IMPORT_APPROVED: ${YOUTUBE_IMPORT_APPROVED:-false}
      QUICK_REFRAME_SOCIAL_IMPORT_APPROVED: ${QUICK_REFRAME_SOCIAL_IMPORT_APPROVED:-false}
      YOUTUBE_IMPORT_BINARY: ${YOUTUBE_IMPORT_BINARY:-yt-dlp}
      YOUTUBE_IMPORT_CONNECT_TIMEOUT: ${YOUTUBE_IMPORT_CONNECT_TIMEOUT:-30}
      YOUTUBE_IMPORT_TOTAL_TIMEOUT: ${YOUTUBE_IMPORT_TOTAL_TIMEOUT:-10800}
      YOUTUBE_IMPORT_STALL_TIMEOUT: ${YOUTUBE_IMPORT_STALL_TIMEOUT:-300}
      YOUTUBE_IMPORT_MAX_DURATION: ${YOUTUBE_IMPORT_MAX_DURATION:-7200}
      YOUTUBE_IMPORT_MAX_BYTES: ${YOUTUBE_IMPORT_MAX_BYTES:-4294967296}
      YOUTUBE_IMPORT_MAX_ATTEMPTS: ${YOUTUBE_IMPORT_MAX_ATTEMPTS:-3}
      YOUTUBE_IMPORT_CONCURRENCY: ${YOUTUBE_IMPORT_CONCURRENCY:-2}
      VISUAL_INTELLIGENCE_ENABLED: ${VISUAL_INTELLIGENCE_ENABLED:-true}
      VISUAL_ANALYSIS_PROFILE: ${VISUAL_ANALYSIS_PROFILE:-BALANCED}
      VISUAL_SAMPLE_INTERVAL_SEC: ${VISUAL_SAMPLE_INTERVAL_SEC:-2.75}
      VISUAL_MAX_FRAMES: ${VISUAL_MAX_FRAMES:-2400}
      VISUAL_EXPENSIVE_MAX_FRAMES: ${VISUAL_EXPENSIVE_MAX_FRAMES:-600}
      VISUAL_ANALYSIS_BUDGET_SEC: ${VISUAL_ANALYSIS_BUDGET_SEC:-0}
      YOLO_MODEL: ${YOLO_MODEL:-yolo26n.pt}
      VISUAL_YOLO_CONFIDENCE: ${VISUAL_YOLO_CONFIDENCE:-0.35}
      VISUAL_YOLO_IMGSZ: ${VISUAL_YOLO_IMGSZ:-416}
      VISUAL_YOLO_BATCH_SIZE: ${VISUAL_YOLO_BATCH_SIZE:-16}
      VISUAL_YOLO_CLASSES: ${VISUAL_YOLO_CLASSES:-person,car,bicycle,motorcycle,bus,truck,cat,dog,cell phone,laptop,tv,book,sports ball,skateboard,surfboard}
      VISUAL_OCR_ENABLED: ${VISUAL_OCR_ENABLED:-true}
      VISUAL_OCR_MAX_FRAMES: ${VISUAL_OCR_MAX_FRAMES:-120}
      VISUAL_OCR_RATIO: ${VISUAL_OCR_RATIO:-0.15}
      VISUAL_FACE_ENABLED: ${VISUAL_FACE_ENABLED:-true}
      VISUAL_FACE_LANDMARKS_ENABLED: ${VISUAL_FACE_LANDMARKS_ENABLED:-true}
      VISUAL_FACE_LANDMARKER_MAX_FRAMES: ${VISUAL_FACE_LANDMARKER_MAX_FRAMES:-40}
      VISUAL_SCENE_ENABLED: ${VISUAL_SCENE_ENABLED:-true}
      VISUAL_CACHE_ENABLED: ${VISUAL_CACHE_ENABLED:-true}
      EDIT_DENSE_ANALYSIS_ENABLED: ${EDIT_DENSE_ANALYSIS_ENABLED:-true}
      EDIT_ANALYSIS_FPS: ${EDIT_ANALYSIS_FPS:-4}
      EDIT_MUSIC_ENABLED: ${EDIT_MUSIC_ENABLED:-false}
      EDIT_MUSIC_REQUIRED: ${EDIT_MUSIC_REQUIRED:-false}
      EDIT_MUSIC_DIR: ${EDIT_MUSIC_DIR:-/app/apps/backend/assets/music}
      EDIT_MUSIC_GENERATED_DIR: ${EDIT_MUSIC_GENERATED_DIR:-/app/apps/backend/assets/music-generated}
      EDIT_MUSIC_ALLOW_UNLICENSED: ${EDIT_MUSIC_ALLOW_UNLICENSED:-false}
      EDIT_SFX_ENABLED: ${EDIT_SFX_ENABLED:-false}
      EDIT_SFX_DIR: ${EDIT_SFX_DIR:-/app/apps/backend/assets/sfx}
      EDIT_SFX_ALLOW_GENERATED: ${EDIT_SFX_ALLOW_GENERATED:-true}
      EDIT_MAX_RENDER_ATTEMPTS: ${EDIT_MAX_RENDER_ATTEMPTS:-3}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_STYLE: ${LLM_API_STYLE:-responses}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-90000}
      LLM_SAFE_INPUT_CHARS: ${LLM_SAFE_INPUT_CHARS:-60000}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      LLM_RETRY_BASE_DELAY_MS: ${LLM_RETRY_BASE_DELAY_MS:-1000}
      LLM_RETRY_MAX_DELAY_MS: ${LLM_RETRY_MAX_DELAY_MS:-5000}
      LLM_RETRY_JITTER_MS: ${LLM_RETRY_JITTER_MS:-750}
      CLIP_JUDGE_PROVIDER: ${CLIP_JUDGE_PROVIDER:-openai}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      NVIDIA_MULTIMODAL_PROVIDER: ${NVIDIA_MULTIMODAL_PROVIDER:-nvidia}
      NVIDIA_MULTIMODAL_MODEL: ${NVIDIA_MULTIMODAL_MODEL:-}
      NVIDIA_REASONING_PROVIDER: ${NVIDIA_REASONING_PROVIDER:-nvidia}
      NVIDIA_REASONING_MODEL: ${NVIDIA_REASONING_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      NVIDIA_TIMEOUT_MS: ${NVIDIA_TIMEOUT_MS:-90000}
      NVIDIA_CONCURRENCY: ${NVIDIA_CONCURRENCY:-2}
      NVIDIA_SUPER_CONCURRENCY: ${NVIDIA_SUPER_CONCURRENCY:-2}
      NVIDIA_OMNI_CONCURRENCY: ${NVIDIA_OMNI_CONCURRENCY:-1}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_BASE_URL: ${GOOGLE_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GOOGLE_CREATIVE_PROVIDER: ${GOOGLE_CREATIVE_PROVIDER:-google}
      GOOGLE_CREATIVE_MODEL: ${GOOGLE_CREATIVE_MODEL:-}
      GOOGLE_TIMEOUT_MS: ${GOOGLE_TIMEOUT_MS:-90000}
      GOOGLE_CONCURRENCY: ${GOOGLE_CONCURRENCY:-2}
      GOOGLE_MULTIMODAL_FAILOVER_ENABLED: ${GOOGLE_MULTIMODAL_FAILOVER_ENABLED:-true}
      NVIDIA_OMNI_TEXT_FAILOVER_ENABLED: ${NVIDIA_OMNI_TEXT_FAILOVER_ENABLED:-false}
      LOCAL_WHOLE_VIDEO_INPUT_CHARS: ${LOCAL_WHOLE_VIDEO_INPUT_CHARS:-12000}
      LLM_CIRCUIT_FAILURE_THRESHOLD: ${LLM_CIRCUIT_FAILURE_THRESHOLD:-3}
      LLM_CIRCUIT_WINDOW_MS: ${LLM_CIRCUIT_WINDOW_MS:-60000}
      LLM_CIRCUIT_COOLDOWN_MS: ${LLM_CIRCUIT_COOLDOWN_MS:-45000}
      LLM_JOB_MAX_CALLS: ${LLM_JOB_MAX_CALLS:-60}
      LLM_JOB_MAX_CRITIC_CALLS: ${LLM_JOB_MAX_CRITIC_CALLS:-4}
      LLM_JOB_MAX_REPAIR_CALLS: ${LLM_JOB_MAX_REPAIR_CALLS:-4}
      LLM_JOB_MAX_RETRY_CALLS: ${LLM_JOB_MAX_RETRY_CALLS:-12}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-true}
      EDIT_MODE_CHAT_AI_MODE: ${EDIT_MODE_CHAT_AI_MODE:-ONLINE}
      CREATIVE_PRIMARY_MODEL: ${CREATIVE_PRIMARY_MODEL:-}
      CREATIVE_ESCALATION_MODEL: ${CREATIVE_ESCALATION_MODEL:-}
      CREATIVE_QUALITY_THRESHOLD: ${CREATIVE_QUALITY_THRESHOLD:-75}
      CREATIVE_MAX_ESCALATION_ATTEMPTS: ${CREATIVE_MAX_ESCALATION_ATTEMPTS:-1}
      CREATIVE_GROUNDING_REVIEW: ${CREATIVE_GROUNDING_REVIEW:-true}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-90000}
      ONLINE_PROVIDER_ORDER: ${ONLINE_PROVIDER_ORDER:-openai}
      GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      NVIDIA_ENABLED: ${NVIDIA_ENABLED:-false}
      ANTHROPIC_ENABLED: ${ANTHROPIC_ENABLED:-false}
      GROQ_ENABLED: ${GROQ_ENABLED:-false}
      OPENROUTER_ENABLED: ${OPENROUTER_ENABLED:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      CLIP_JUDGE_CONCURRENCY: ${CLIP_JUDGE_CONCURRENCY:-3}
      CLIP_UNDERSTANDING_BATCH_SIZE: ${CLIP_UNDERSTANDING_BATCH_SIZE:-5}
      CLIP_UNDERSTANDING_CONCURRENCY: ${CLIP_UNDERSTANDING_CONCURRENCY:-2}
      CLIP_CRITIC_CONCURRENCY: ${CLIP_CRITIC_CONCURRENCY:-3}
      LLM_MULTIMODAL_UNDERSTANDING_TIMEOUT_MS: ${LLM_MULTIMODAL_UNDERSTANDING_TIMEOUT_MS:-25000}
      LLM_MULTIMODAL_UNDERSTANDING_MAX_ATTEMPTS: ${LLM_MULTIMODAL_UNDERSTANDING_MAX_ATTEMPTS:-2}
      LLM_WHOLE_VIDEO_UNDERSTANDING_TIMEOUT_MS: ${LLM_WHOLE_VIDEO_UNDERSTANDING_TIMEOUT_MS:-35000}
      LLM_WHOLE_VIDEO_UNDERSTANDING_MAX_ATTEMPTS: ${LLM_WHOLE_VIDEO_UNDERSTANDING_MAX_ATTEMPTS:-2}
      LLM_CLIP_UNDERSTANDING_TIMEOUT_MS: ${LLM_CLIP_UNDERSTANDING_TIMEOUT_MS:-25000}
      LLM_CLIP_UNDERSTANDING_MAX_ATTEMPTS: ${LLM_CLIP_UNDERSTANDING_MAX_ATTEMPTS:-2}
      LLM_CREATIVE_GENERATION_TIMEOUT_MS: ${LLM_CREATIVE_GENERATION_TIMEOUT_MS:-25000}
      LLM_CREATIVE_GENERATION_MAX_ATTEMPTS: ${LLM_CREATIVE_GENERATION_MAX_ATTEMPTS:-2}
      LLM_CRITIC_TIMEOUT_MS: ${LLM_CRITIC_TIMEOUT_MS:-20000}
      LLM_CRITIC_MAX_ATTEMPTS: ${LLM_CRITIC_MAX_ATTEMPTS:-2}
      LLM_COMPONENT_REPAIR_TIMEOUT_MS: ${LLM_COMPONENT_REPAIR_TIMEOUT_MS:-15000}
      LLM_COMPONENT_REPAIR_MAX_ATTEMPTS: ${LLM_COMPONENT_REPAIR_MAX_ATTEMPTS:-2}
      CLIP_MIN_STRONG_SCORE: ${CLIP_MIN_STRONG_SCORE:-60}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the ignored .env file}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      NODE_ENV: production
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      TRUST_CLOUDFLARE_IP: ${TRUST_CLOUDFLARE_IP:-true}
      DEFAULT_USER_CREDITS: ${DEFAULT_USER_CREDITS:-5}
      PASSWORD_HASH_PEPPER: ${PASSWORD_HASH_PEPPER:?Set a stable random PASSWORD_HASH_PEPPER in the ignored .env file}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      UPLOAD_STAGING_DIR: /app/upload-staging
      MINIO_BUCKET: ai-content-platform
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    volumes:
      # Your curated music folders, mounted read-only: drop tracks in, run
      # `npm run music:scan` in apps/backend, and restart the backend - no rebuild.
      - ./apps/backend/assets/music:/app/apps/backend/assets/music:ro
      # Your sound-design assets, mounted read-only: the folder a file sits in is
      # its category, so no scan step is needed - just restart the backend.
      - ./apps/backend/assets/sfx:/app/apps/backend/assets/sfx:ro
      - upload_staging:/app/upload-staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_started

  ai-service:
    build:
      context: ./apps/ai-service
    container_name: ai-content-ai-service
    restart: unless-stopped
    environment:
      PORT: 8000
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the ignored .env file}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-/models/whisper-base}
      WHISPER_TAIL_MODEL_PATH: ${WHISPER_TAIL_MODEL_PATH:-/models/whisper-medium}
      WHISPER_TAIL_MODEL_NAME: ${WHISPER_TAIL_MODEL_NAME:-whisper-medium}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      ENABLE_VISUAL_ANALYSIS: ${ENABLE_VISUAL_ANALYSIS:-false}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_VAD_MIN_SILENCE_MS: ${WHISPER_VAD_MIN_SILENCE_MS:-500}
      WHISPER_DIARIZATION_ENABLED: ${WHISPER_DIARIZATION_ENABLED:-false}
      VISUAL_INTELLIGENCE_ENABLED: ${VISUAL_INTELLIGENCE_ENABLED:-true}
      VISUAL_MODEL_DIR: /models/visual
      # PaddleOCR 3.x delegates model downloads to PaddleX. This is the
      # officially supported PaddleX cache-root override.
      PADDLE_PDX_CACHE_HOME: /models/visual/paddle
      # Keep Ultralytics' settings separate from the model files and on the
      # persistent visual_models volume.
      YOLO_CONFIG_DIR: /models/visual/ultralytics-config
      YOLO_MODEL: ${YOLO_MODEL:-yolo26n.pt}
      VISUAL_ANALYSIS_PROFILE: ${VISUAL_ANALYSIS_PROFILE:-BALANCED}
      VISUAL_SAMPLE_INTERVAL_SEC: ${VISUAL_SAMPLE_INTERVAL_SEC:-2.75}
      VISUAL_MAX_FRAMES: ${VISUAL_MAX_FRAMES:-2400}
      VISUAL_EXPENSIVE_MAX_FRAMES: ${VISUAL_EXPENSIVE_MAX_FRAMES:-600}
      VISUAL_ANALYSIS_BUDGET_SEC: ${VISUAL_ANALYSIS_BUDGET_SEC:-0}
      VISUAL_YOLO_CONFIDENCE: ${VISUAL_YOLO_CONFIDENCE:-0.35}
      VISUAL_YOLO_IMGSZ: ${VISUAL_YOLO_IMGSZ:-416}
      VISUAL_YOLO_BATCH_SIZE: ${VISUAL_YOLO_BATCH_SIZE:-16}
      VISUAL_YOLO_CLASSES: ${VISUAL_YOLO_CLASSES:-person,car,bicycle,motorcycle,bus,truck,cat,dog,cell phone,laptop,tv,book,sports ball,skateboard,surfboard}
      VISUAL_OCR_ENABLED: ${VISUAL_OCR_ENABLED:-true}
      VISUAL_OCR_MAX_FRAMES: ${VISUAL_OCR_MAX_FRAMES:-120}
      VISUAL_OCR_RATIO: ${VISUAL_OCR_RATIO:-0.15}
      VISUAL_FACE_ENABLED: ${VISUAL_FACE_ENABLED:-true}
      VISUAL_FACE_LANDMARKS_ENABLED: ${VISUAL_FACE_LANDMARKS_ENABLED:-true}
      VISUAL_FACE_LANDMARKER_MAX_FRAMES: ${VISUAL_FACE_LANDMARKER_MAX_FRAMES:-40}
      VISUAL_SCENE_ENABLED: ${VISUAL_SCENE_ENABLED:-true}
      VISUAL_CACHE_ENABLED: ${VISUAL_CACHE_ENABLED:-true}
      VISUAL_CACHE_DIR: /models/visual/cache
    volumes:
      - ./models/whisper-base:/models/whisper-base:ro
      - visual_models:/models/visual
    command:
      - sh
      - -c
      - >-
        python scripts/setup_visual_models.py;
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-8000}:8000"

    depends_on:
      minio:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: ai-content-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_content_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_content_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-content-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ai-content-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the ignored .env file}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: ai-content-minio-init
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the ignored .env file}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-content-platform}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      "

volumes:
  visual_models:
  postgres_data:
  redis_data:
  minio_data:
  upload_staging:
