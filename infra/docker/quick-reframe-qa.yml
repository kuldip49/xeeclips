services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: disposable-quick-reframe-qa
      POSTGRES_DB: quick_reframe_qa
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d quick_reframe_qa]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: qrqa
      MINIO_ROOT_PASSWORD: disposable-quick-reframe-qa
  ai-service:
    image: ai-content-platform-ai-service:latest
    environment:
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: qrqa
      MINIO_ROOT_PASSWORD: disposable-quick-reframe-qa
      WHISPER_MODEL_PATH: /models/whisper-base
      WHISPER_TAIL_MODEL_PATH: /models/whisper-medium
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      HF_HUB_OFFLINE: 1
      TRANSFORMERS_OFFLINE: 1
      VISUAL_MODEL_DIR: /models/visual
      VISUAL_OCR_ENABLED: 'false'
      VISUAL_YOLO_ENABLED: 'false'
    volumes:
      - ../../models:/models:ro
  backend:
    image: ai-content-platform-backend:latest
    command: [sh, -c, 'npm run db:migrate && node -r ./scripts/quick-reframe-qa-provider.cjs dist/main.js']
    ports:
      - 127.0.0.1:4100:4000
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:disposable-quick-reframe-qa@postgres:5432/quick_reframe_qa
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: qrqa
      MINIO_ROOT_PASSWORD: disposable-quick-reframe-qa
      MINIO_BUCKET: quick-reframe-qa
      AI_SERVICE_URL: http://ai-service:8000
      FRONTEND_ORIGIN: http://localhost:3100,http://127.0.0.1:3100
      PASSWORD_HASH_PEPPER: disposable-quick-reframe-qa-pepper-20261016
      XEEPRO_ENABLED: 'true'
      OPENAI_ENABLED: 'true'
      OPENAI_API_KEY: synthetic-qa-key
      EDIT_MODE_CHAT_AI_MODE: ONLINE
      QUICK_REFRAME_QA: '1'
      QUICK_REFRAME_QA_STATE: /qa/provider-state.json
      GENERATION_STYLING_RECOVERY: 'false'
    volumes:
      - ../../apps/backend/dist:/app/apps/backend/dist:ro
      - ../../apps/backend/scripts:/app/apps/backend/scripts:ro
      - ../../packages/shared:/app/packages/shared:ro
      - ../../.cache/quick-reframe-qa:/qa
